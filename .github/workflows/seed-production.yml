name: Seed production demo data

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --project workshop-erp --token=${{ secrets.VERCEL_TOKEN }}

      - name: Migrate and seed production database
        run: vercel env run --environment=production -- node scripts/prod-db-setup.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
