<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E1A" />
    <title>Нет сети — Produsion</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: linear-gradient(180deg, #0b0e1a 0%, #16130f 40%, #f3f4f7 100%);
        color: #101828;
      }
      .card {
        width: min(420px, 100%);
        border-radius: 16px;
        background: #fff;
        border: 1px solid #e5e7eb;
        padding: 24px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(16, 24, 40, 0.12);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 16px; color: #667085; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        background: #0e1522;
        color: #e8c978;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Нет подключения</h1>
      <p>Проверьте интернет и попробуйте снова. Некоторые данные могут открыться из кэша.</p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
