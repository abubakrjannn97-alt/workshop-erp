<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1522" />
    <title>Нет сети</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f4f2ec;
        color: #1a1d23;
      }
      .card {
        width: min(22rem, 100%);
        border-radius: 12px;
        background: #fff;
        border: 1px solid #e4e1d8;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; line-height: 28px; }
      p { margin: 0 0 16px; color: #5c6470; font-size: 15px; line-height: 24px; }
      button {
        width: 100%;
        min-height: 44px;
        border: 1px solid #0e1522;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        background: #0e1522;
        color: #f8f7f4;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="" width="40" height="40" style="border-radius:22%;margin:0 0 16px;display:block" />
      <h1>Нет подключения</h1>
      <p>Проверьте интернет и попробуйте снова. Некоторые данные могут открыться из кэша.</p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
