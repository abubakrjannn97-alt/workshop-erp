<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4C5A9" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#C8B898" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FAFAF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAFAF8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#C8B898" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#D4C5A9" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#FAFAF8"/>
  <rect width="400" height="300" filter="url(#noise)" opacity="0.06"/>
  <rect width="400" height="300" fill="url(#fade)"/>
  <rect width="400" height="300" fill="url(#hfade)"/>
  <ellipse cx="320" cy="80" rx="120" ry="90" fill="#C8B898" opacity="0.08"/>
  <ellipse cx="350" cy="50" rx="80" ry="60" fill="#B8A888" opacity="0.06"/>
</svg>
